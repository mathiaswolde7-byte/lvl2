<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — LVL</title>
  <link rel="icon" href="assets/lvl-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{if(sessionStorage.getItem("lvl-fade"))document.documentElement.classList.add("arriving")}catch(e){}</script>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*.html*"},"eagerness":"moderate"}]}</script>
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <div class="wrap page-head">
      <h1 class="display h1" data-title>Shop all</h1>
      <span class="label muted" data-count-label></span>
    </div>

    <div class="wrap filters">
      <div class="filters__group" role="group" aria-label="Category" data-cats-filter></div>
      <div class="filters__group">
        <div class="filters__group" role="group" aria-label="Sort">
          <button class="pill" data-sort="featured">Featured</button>
          <button class="pill" data-sort="new">New</button>
          <button class="pill" data-sort="sale">Sale</button>
          <button class="pill" data-sort="low">Price ↑</button>
          <button class="pill" data-sort="high">Price ↓</button>
        </div>
        <div class="view-toggle" role="group" aria-label="Grid size">
          <button data-view="normal" aria-pressed="true">Large</button>
          <button data-view="dense" aria-pressed="false">Small</button>
        </div>
      </div>
    </div>

    <div class="wrap colors-row">
      <div class="filters__group" role="group" aria-label="Shop by color" data-colors-filter></div>
      <div class="filters__group" data-active></div>
    </div>

    <div class="grid" data-grid></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
