<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed — LVL</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/lvl-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{if(sessionStorage.getItem("lvl-fade"))document.documentElement.classList.add("arriving")}catch(e){}</script>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*.html*"},"eagerness":"moderate"}]}</script>
</head>
<body data-page="success">
  <div id="site-header"></div>

  <main class="wrap">
    <div class="confirm">
      <span class="badge label" data-ref>Order confirmed</span>
      <h1 class="display h1">You leveled up.</h1>
      <p data-msg>Thanks for your order. A receipt is on its way to your inbox.</p>
      <div class="confirm__items" data-items hidden></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="shop.html">Keep shopping</a>
        <a class="btn btn--ghost" href="index.html">Back to home</a>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
