<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All clothing — LVL</title>
  <link rel="icon" href="assets/lvl-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try{if(sessionStorage.getItem("lvl-fade"))document.documentElement.classList.add("arriving")}catch(e){}</script>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*.html*"},"eagerness":"moderate"}]}</script>
</head>
<body data-page="all">
  <div id="site-header"></div>

  <main>
    <div class="wrap page-head">
      <div>
        <span class="label muted">Drop 01 · Everything we make</span>
        <h1 class="display h1" style="margin-top:6px">All clothing</h1>
      </div>
      <span class="label muted" data-all-count></span>
    </div>

    <div class="wrap filters jump">
      <nav class="filters__group" aria-label="Jump to category" data-jump></nav>
      <div class="filters__group">
        <label class="switch label"><input type="checkbox" data-every-color checked> Show every color</label>
        <label class="switch label"><input type="checkbox" data-hide-out> Hide sold out</label>
      </div>
    </div>

    <div data-all></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
